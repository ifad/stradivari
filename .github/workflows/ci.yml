name: CI

on:
  push:
    branches: [ master, "upgrade/**" ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # upgrade target
          - { ruby: "4.0.5", rails: "~> 8.1.0" }
          - { ruby: "3.4",   rails: "~> 8.1.0" }
          - { ruby: "3.4",   rails: "~> 7.2.0" }
          # backward compat — consumers still on the old stack (Haml 5 native
          # haml_tag via super-delegation, Ransack 2, sqlite3 1.4 for Ruby 2.7)
          - { ruby: "2.7", rails: "~> 6.1.0", haml: "~> 5.2", ransack: "~> 2.4", sqlite3: "~> 1.4.0" }
    name: "ruby ${{ matrix.ruby }} / rails ${{ matrix.rails }}"
    env:
      BUNDLE_GEMFILE: test/Gemfile.ci
      RAILS_VERSION: ${{ matrix.rails }}
      HAML_VERSION: ${{ matrix.haml }}
      RANSACK_VERSION: ${{ matrix.ransack }}
      SQLITE3_VERSION: ${{ matrix.sqlite3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Smoke (load + render on the version stack)
        run: bundle exec ruby test/smoke.rb
