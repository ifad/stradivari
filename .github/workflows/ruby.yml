name: Ruby specs

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby-version }} / ${{ matrix.gemfile }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stradivari_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3', '3.4', '4.0']
        gemfile: [rails_7.2, rails_8.0, rails_8.1]
        channel: ['stable']

        include:
          # Experimental: failures here do not fail the workflow
          - ruby-version: '4.0'
            gemfile: rails_edge
            channel: 'experimental'
          - ruby-version: 'head'
            gemfile: rails_8.0
            channel: 'experimental'
          - ruby-version: 'head'
            gemfile: rails_8.1
            channel: 'experimental'
          - ruby-version: 'head'
            gemfile: rails_edge
            channel: 'experimental'

        exclude:
          # Rails 7.2 is security-only and was never updated for Ruby 4.0
          - ruby-version: '4.0'
            gemfile: rails_7.2

    continue-on-error: ${{ matrix.channel == 'experimental' }}

    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/stradivari_test

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run specs
        run: bundle exec rake spec

  frontend:
    name: Front-end lint and CSS build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Run JavaScript tests
        run: pnpm test:js
      - name: Build stylesheet
        run: pnpm build:css
      - name: Check that the generated stylesheet is up to date
        run: git diff --exit-code app/assets/stylesheets/stradivari/generated.css
