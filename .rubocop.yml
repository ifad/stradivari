plugins:
  - rubocop-packaging
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRailsVersion: 7.2
  TargetRubyVersion: 3.2
  Exclude:
    - .git/**/*
    - .github/**/*
    - bin/**/*
    - gemfiles/**/*
    - node_modules/**/*
    - spec/internal/**/*
    - tmp/**/*
    - vendor/**/*

# Frozen string literal comment is added to spec files automatically; production code
# uses .freeze on String constants where mutation safety matters.
Style/FrozenStringLiteralComment:
  Exclude:
    - 'lib/**/*'
    - 'app/**/*'
    - 'stradivari.gemspec'

# Public API documentation is provided via the README and CHANGELOG.
Style/Documentation:
  Enabled: false

# `===` is used as part of an idiomatic dispatch pattern.
Style/CaseEquality:
  Exclude:
    - 'lib/stradivari/table/generator.rb'

# `html_safe` is intentionally used for known-safe HAML output.
Rails/OutputSafety:
  Exclude:
    - 'lib/stradivari/filter/helpers.rb'
    - 'lib/stradivari/xlsx/generator.rb'

Layout/LineLength:
  Enabled: false

Naming/PredicateMethod:
  AllowBangMethods: true

Rails/Delegate:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

Style/ArgumentsForwarding:
  Enabled: false

Style/OneClassPerFile:
  Exclude:
    - 'spec/**/*'

# Block-length limits are relaxed for HAML rendering blocks and DSL definitions.
Metrics/BlockLength:
  Exclude:
    - 'lib/stradivari/filter/builder/**/*'
    - 'lib/stradivari/filter/generator.rb'

# Metrics cops are heuristic and most violations sit inside HAML/DSL render lambdas
# whose structure is dictated by the markup. Refactoring would not improve clarity.
Metrics/AbcSize:
  Exclude:
    - 'lib/**/*'
    - 'app/**/*'
    - 'spec/support/**/*'

Metrics/MethodLength:
  Exclude:
    - 'lib/**/*'
    - 'app/**/*'
    - 'spec/support/**/*'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/**/*'
    - 'app/**/*'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/**/*'
    - 'app/**/*'

Metrics/ClassLength:
  Exclude:
    - 'lib/**/*'
    - 'app/**/*'

Metrics/ParameterLists:
  Exclude:
    - 'lib/**/*'
    - 'app/**/*'

RSpec/DescribeClass:
  Exclude:
    - 'spec/stradivari/coverage_edges_spec.rb'
    - 'spec/stradivari/csv_xlsx_branches_spec.rb'
    - 'spec/stradivari/filter/builder_branches_spec.rb'
    - 'spec/stradivari/filter/builder_spec.rb'
    - 'spec/stradivari/table/builder_primitives_spec.rb'
    - 'spec/stradivari/table/builder_spec.rb'

RSpec/MultipleDescribes:
  Exclude:
    - 'spec/stradivari/csv_xlsx_branches_spec.rb'
    - 'spec/stradivari/filter/builder_branches_spec.rb'
    - 'spec/stradivari/filter/generator_spec.rb'
    - 'spec/stradivari/table/builder_spec.rb'
    - 'spec/stradivari/table/model/active_record_spec.rb'
    - 'spec/stradivari/xlsx/generator_spec.rb'

RSpec/SpecFilePathFormat:
  Exclude:
    - 'spec/stradivari/controller_spec.rb'
    - 'spec/stradivari/engine_spec.rb'

Packaging/GemspecGit:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false
